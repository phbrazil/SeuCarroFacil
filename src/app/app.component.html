<app-background *ngIf="!user; else logged">
  <app-header id="home"></app-header>
  <app-search id="search"></app-search>
  <app-results id="results"></app-results>
  <app-services id="services"></app-services>
  <app-about id="about"></app-about>
  <app-footer id="contact"></app-footer>
</app-background>

<ng-template #logged>
  <router-outlet></router-outlet>
</ng-template>
