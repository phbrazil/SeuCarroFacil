<p-menubar [model]="items" class="bg-color">
  <ng-template pTemplate="start">
    <div class="logo">
      <img src="assets/img/logo.png" alt="Logo" />
    </div>
  </ng-template>

  <ng-template pTemplate="end">
    <button
      pButton
      label="Contato"
      icon="pi pi-envelope"
      class="p-button-text p-button-rounded p-button-sm"
      (click)="scrollTo('contact')"
    ></button>
  </ng-template>
</p-menubar>
