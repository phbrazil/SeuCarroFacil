<p-menubar [model]="items" class="bg-color">
  <img src="assets/img/logo.png" height="50" class="p-mr-2" alt="brand logo" />
  <ng-template pTemplate="start">
    <div class="logo"></div>
  </ng-template>

  <ng-template pTemplate="end">
    <button
      pButton
      label="Contato"
      icon="pi pi-envelope"
      class="p-button-text p-button-rounded p-button-sm"
      (click)="scrollTo('contact')"
    ></button>
  </ng-template>
</p-menubar>
